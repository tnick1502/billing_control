services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:?Set DEV_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${DEV_POSTGRES_DB:?Set DEV_POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 90s
    environment:
      DATABASE_URL: ${DEV_DATABASE_URL:?Set DEV_DATABASE_URL in .env}
      DATABASE_SSL: ${DEV_DATABASE_SSL:?Set DEV_DATABASE_SSL in .env}
      DATABASE_SSL_VERIFY: ${DEV_DATABASE_SSL_VERIFY:?Set DEV_DATABASE_SSL_VERIFY in .env}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:?Set DB_CONNECT_TIMEOUT in .env}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:?Set DB_COMMAND_TIMEOUT in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:?Set DB_POOL_SIZE in .env}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:?Set DB_MAX_OVERFLOW in .env}
      DB_CONNECTION_BUDGET: ${DB_CONNECTION_BUDGET:?Set DB_CONNECTION_BUDGET in .env}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:?Set DB_POOL_TIMEOUT in .env}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:?Set DB_POOL_RECYCLE in .env}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
      LOG_REQUESTS: ${LOG_REQUESTS:?Set LOG_REQUESTS in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:?Set SESSION_TTL_HOURS in .env}
      SESSION_IDLE_RENEW_MINUTES: ${SESSION_IDLE_RENEW_MINUTES:?Set SESSION_IDLE_RENEW_MINUTES in .env}
      CORS_ORIGINS: ${DEV_CORS_ORIGINS:?Set DEV_CORS_ORIGINS in .env}
      PUBLIC_ORIGIN: ${DEV_PUBLIC_ORIGIN:?Set DEV_PUBLIC_ORIGIN in .env}
      SEED_ON_STARTUP: ${DEV_SEED_ON_STARTUP:?Set DEV_SEED_ON_STARTUP in .env}
      FORCE_RESEED: ${DEV_FORCE_RESEED:?Set DEV_FORCE_RESEED in .env}
      WIPE_DB: ${DEV_WIPE_DB:?Set DEV_WIPE_DB in .env}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    environment:
      ORIGIN: ${DEV_FRONTEND_ORIGIN:?Set DEV_FRONTEND_ORIGIN in .env}
      BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:?Set FRONTEND_BACKEND_ORIGIN in .env}
      PROTOCOL_HEADER: ${FRONTEND_PROTOCOL_HEADER:?Set FRONTEND_PROTOCOL_HEADER in .env}
      HOST_HEADER: ${FRONTEND_HOST_HEADER:?Set FRONTEND_HOST_HEADER in .env}
      BODY_SIZE_LIMIT: ${FRONTEND_BODY_SIZE_LIMIT:?Set FRONTEND_BODY_SIZE_LIMIT in .env}
    depends_on:
      backend:
        condition: service_healthy
