services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 90s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_VERIFY: ${DATABASE_SSL_VERIFY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      FORCE_RESEED: ${FORCE_RESEED:-false}
      # ВНИМАНИЕ: WIPE_DB=true при КАЖДОМ старте полностью удаляет и пересоздаёт схему БД (drop_all+create_all).
      # Использовать разово для чистого развёртывания, затем вернуть false.
      WIPE_DB: ${WIPE_DB:-false}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    environment:
      ORIGIN: ${PUBLIC_ORIGIN}
      BACKEND_ORIGIN: http://backend:8000
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      BODY_SIZE_LIMIT: 104857600
    depends_on:
      backend:
        condition: service_healthy
